[project]
name = "niryo-lift-rl"
version = "0.1.0"
description = "SAC+HER for grasping and lifting with a Niryo NED2 arm in MuJoCo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "niryo-gym",
    "mujoco==3.3.7",            
    "gymnasium==1.4.0",
    "stable-baselines3==2.9.2",
    "torch>=2.8",
    "numpy<3",
    "gymnasium-robotics==1.4.2",
    "pyyaml", "pandas", "matplotlib", "tensorboard", "imageio", "tqdm", "rich",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
niryo-gym = { path = "../niryo-gym", editable = true }

# niryo-gym = { git = "https://github.com/<你>/niryo-gym", rev = "<commit-hash>" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niryo_lift"]